<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Gallery</title>
  <link rel="shortcut icon" href="/static/favicon.ico">
  <style>
    html, body { height: 100%; margin: 0; background: #111; }
    body { display: flex; align-items: center; justify-content: center; }
    img { max-width: 100%; max-height: 100vh; }
  </style>
</head>
<body>
  <a href="/"><img id="pic" src="/dynamic/next-slide" alt=""></a>
  <script>
    async function slideit() {
      const img = document.getElementById('pic')
      try {
        const style = await fetch('/dynamic/slide-style').then(r => r.text())
        img.style.cssText = style
        img.src = '/dynamic/next-slide?' + Date.now()
      } catch (e) {}
      setTimeout(slideit, 5200)
    }
    slideit()
  </script>
</body>
</html>
