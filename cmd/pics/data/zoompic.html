{{template "header" .}}

<main class="zoom">
  {{if eq .Ext ".mov" ".avi"}}
  <video class="zoom-vid" src="/photo/orig/{{.Id}}" controls></video>
  {{else}}
  <a href="/">
    <img class="zoom-img" src="/photo/thumb/{{.Id}}" alt="{{.Date}}">
  </a>
  {{end}}
  <div id="faces" class="faces" data-pic="{{.Id}}" data-edit="{{if .CanEdit}}1{{end}}"></div>
</main>

<footer class="bar bottom zoom-bar">
  {{if .CanEdit}}
  <textarea id="pic-notes{{.Index}}">{{.Notes}}</textarea>
  <button type="button" onclick="saveNotes({{.Index}})">Save Notes</button>
  {{else}}
  <div class="notes-ro">{{.Notes}}</div>
  {{end}}
  <div class="spacer"></div>
  <span class="muted">Taken {{.Date}}</span>
  <a class="btn" href="/photo/orig/{{.Id}}">Original</a>
  <a class="btn" href="/photo/thumb/{{.Id}}">Thumb</a>
  {{if .User}}
  <span class="who">{{.User}}</span>
  <form method="post" action="/logout"><button type="submit">Logout</button></form>
  {{end}}
</footer>

<script src="/static/zoompic.js"></script>

{{template "footer"}}
