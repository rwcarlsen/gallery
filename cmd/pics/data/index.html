{{template "header" .}}

<header class="bar top">
  <a class="brand" href="/">Gallery</a>
  <div class="when" id="when">
    <button type="button" id="when-btn">When</button>
    <div class="when-menu" id="time-nav"></div>
  </div>
  <form class="search" id="search-form" action="#">
    <input id="search-q" type="search" placeholder="Search photos…" autocomplete="off" value="{{.Filter}}">
    <button type="button" id="search-clear" hidden>×</button>
  </form>
  <div class="spacer"></div>
  <a href="/dynamic/slideshow">Slideshow</a>
  <span class="stats" id="stats"></span>
  {{if .User}}
  <span class="who">{{.User}}</span>
  <form method="post" action="/logout"><button type="submit">Logout</button></form>
  {{end}}
</header>

<main id="pic-gallery"></main>

<footer class="bar bottom" id="page-nav"></footer>

<script src="/static/my.js"></script>

{{template "footer"}}
